; Konelsis - yerel gelistirme icin ek PHP ayari.
;
; Sorun: "php artisan serve" yerlesik sunucuyu ayri bir surecte baslatir ve o
; surece TMP, TEMP ve USERPROFILE degiskenlerini gecirmez. Windows'ta PHP bu
; degiskenler olmadan gecici klasor olarak C:\Windows yolunu secer; bu klasor
; normal kullaniciya yazma izni vermez. Sonucta:
;
;   - gelen dosya icin gecici dosya olusturulamaz  -> "failed to upload"
;   - tmpfile() false doner                        -> TemporaryUploadedFile hatasi
;
; Cozum: her iki gecici klasor ayarini da projenin icine sabitlemek. Boylece
; ayar, ortam degiskenlerinden bagimsiz calisir.
;
; Yollar, yerlesik sunucunun calisma dizinine (public/) goredir; proje baska
; bir klasore tasinsa da gecerli kalir.

; Yuklenen dosyanin PHP tarafindaki ilk gecici kopyasi
upload_tmp_dir = "../storage/app/upload-tmp"

; tmpfile(), gecici akislar ve kutuphanelerin kullandigi genel gecici klasor
sys_temp_dir = "../storage/app/upload-tmp"
